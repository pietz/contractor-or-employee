<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contractor or employee? A 1-minute check for US companies | WorkGenius</title>
<meta name="description" content="Answer up to 5 quick questions based on IRS, Department of Labor and state ABC tests. Most checks take under a minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Blue Frost tokens (WorkGenius design system: tailwind.css @theme + themes.css :root)
   ===================================================================== */
:root{
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8;
  --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --brand-navy:#072F47;                 /* logo */
  --blue-50:#d0e8ff; --blue-100:#bbdeff; --blue-200:#92cbff; --blue-400:#41a4ff; --blue-500:#1890ff; --blue-600:#0074df; --blue-700:#0057a7;
  --frost:#C8DBFF;                      /* radial page glow */
  --bg-primary:#334155; --primary-hover:#1e293b; --primary-pressed:#0f172a;
  --text-strong:#334155; --text-secondary:#64748b; --text-tertiary:#94a3b8; --text-link:#0369a1;
  --glass:rgb(255 255 255 / .4); --glass-nested:rgb(248 250 252 / .5); --card:#fff;
  --blur-glass:32px;
  --border:#cbd5e1;
  --success-bg:#f0fdf4; --success-text:#15803d; --success-border:#22c55e;
  --warning-bg:#fffbeb; --warning-text:#b45309; --warning-border:#f59e0b;
  --danger-bg:#fef2f2;  --danger-text:#b91c1c;  --danger-border:#ef4444;
  --info-bg:#f0f9ff; --info-text:#0369a1;
  --r-md:6px; --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-3xl:24px; --pill:9999px;
  --h-sm:2.5rem; --h-md:3rem; --h-lg:3.5rem;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05); --shadow-md:0 4px 6px -1px rgb(0 0 0 / .1); --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .15);
  --ease:cubic-bezier(.22,1,.36,1);
  /* Evidence colors: 1099 side in brand blue, W-2 side in primary slate */
  --c-contractor:#1890ff; --c-employee:#334155;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text-strong);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:var(--s300);min-height:100vh;display:flex;flex-direction:column;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 120% 85% at 50% 100%,var(--frost) 0%,var(--s300) 65%)}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;color:var(--text-strong);letter-spacing:-.02em}
p{margin:0}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--s700);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* ---------- Glass surfaces (Card / Stepper) ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur-glass));backdrop-filter:blur(var(--blur-glass));border-radius:var(--r-3xl);border:1px solid rgb(255 255 255 / .35)}
.nested{background:var(--glass-nested);border-radius:var(--r-2xl)}

/* ---------- Buttons (freelancer ui/Button.tsx) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:var(--h-md);padding:8px 32px;border:1px solid;border-radius:var(--pill);font-weight:500;font-size:16px;line-height:1.3;text-align:center;transition:background .2s,border-color .2s,transform .2s var(--ease),box-shadow .2s;text-decoration:none !important}
.btn .i{font-size:15px;transition:transform .25s var(--ease)}
.btn:hover .i.arrow{transform:translateX(3px)}
.btn-primary{background:var(--s700);color:#fff;border-color:var(--s700)}
.btn-primary:hover{background:var(--s600);border-color:var(--s600);color:#fff}
.btn-primary:active{background:var(--primary-pressed)}
.btn-default{background:#fff;color:var(--s700);border-color:var(--s200)}
.btn-default:hover{background:var(--s50);color:var(--s700)}
.btn-faded{background:rgb(255 255 255 / .4);color:var(--s700);border-color:var(--s200)}
.btn-faded:hover{background:var(--s50)}
.btn-sm{min-height:var(--h-sm);padding:6px 18px;font-size:14px;gap:8px}
.btn-lg{min-height:var(--h-lg);padding:10px 36px;font-size:17px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- Chrome ---------- */
.topbar{position:relative;z-index:5}
.topbar-in{max-width:1180px;margin:0 auto;height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.toolname{display:flex;align-items:center;gap:10px;background:rgb(255 255 255 / .4);border:0;border-radius:var(--pill);padding:6px 16px 6px 6px;font-size:14px;font-weight:600;color:var(--s700);transition:background .2s}
.toolname:hover{background:rgb(255 255 255 / .6)}
.toolname .m{width:28px;height:28px;border-radius:999px;background:var(--s700);color:#fff;display:grid;place-items:center}
.toolname .m svg{width:15px;height:15px}
.byline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--s500);font-weight:500;transition:opacity .4s}
.byline .wg-logo{height:22px;width:auto;color:var(--s500);transition:color .4s}
body:not(.is-result) .byline{opacity:.75}
body.is-result .byline .wg-logo{color:var(--brand-navy)}
.byline a{display:flex}
main{flex:1;position:relative}
.footer{padding:28px 32px 32px;text-align:center;font-size:12px;color:var(--s500)}
.footer a{color:var(--s500)}

/* ---------- Views + transitions ---------- */
.view{animation:viewIn .5s var(--ease) both}
.view.leaving{animation:viewOut .22s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- Intro ---------- */
.intro{max-width:880px;margin:0 auto;padding:118px 32px 0;text-align:center}
.pill-note{display:inline-flex;align-items:center;gap:8px;background:rgb(255 255 255 / .4);border-radius:var(--pill);padding:6px 14px 6px 8px;font-size:13px;font-weight:500;color:var(--s600)}
.pill-note b{background:#fff;color:var(--s700);font-weight:600;border-radius:var(--pill);padding:2px 9px;font-size:12px}
.intro h1{font-size:68px;line-height:1.02;font-weight:700;letter-spacing:-.045em;margin-top:22px;color:var(--s700)}
.intro .lede{font-size:19px;line-height:1.6;color:var(--s500);max-width:620px;margin:20px auto 0}
.fork{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;max-width:720px;margin:44px auto 0;text-align:left}
.fork-card{display:flex;align-items:center;gap:16px;border:0;border-radius:var(--r-3xl);padding:22px 22px 22px 22px;text-align:left;transition:transform .25s var(--ease),background .2s}
.fork-card:hover{transform:translateY(-2px)}
.fork-main{background:#fff;box-shadow:var(--shadow-md)}
.fork-main:hover{box-shadow:var(--shadow-lg)}
.fork-alt{background:rgb(255 255 255 / .4);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px)}
.fork-alt:hover{background:rgb(255 255 255 / .6)}
.fork-ic{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;flex:none}
.fork-main .fork-ic{background:var(--s700);color:#fff}
.fork-alt .fork-ic{background:rgb(255 255 255 / .6);color:var(--s600);border:1px solid var(--s200)}
.fork-ic svg{width:20px;height:20px}
.fork-card b{display:block;font-size:17px;font-weight:600;color:var(--s700);letter-spacing:-.01em}
.fork-card span.s{display:block;font-size:14px;color:var(--s500);margin-top:2px}
.fork-card .go{margin-left:auto;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--s700);background:#fff;border:1px solid var(--s200);flex:none;transition:transform .25s var(--ease)}
.fork-main .go{background:var(--s700);border-color:var(--s700);color:#fff}
.fork-card:hover .go{transform:translateX(3px)}
.fork-card .go svg{width:15px;height:15px}
.worker-note{max-width:720px;margin:14px auto 0;text-align:left;padding:20px 22px;font-size:14.5px;color:var(--s600);line-height:1.6;animation:viewIn .35s var(--ease) both}
.worker-note b{color:var(--s700)}
.worker-note .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.trust{list-style:none;padding:0;margin:40px auto 0;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 26px;font-size:13.5px;color:var(--s600);font-weight:500}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:16px;height:16px;color:var(--s700)}

/* ---------- Evidence meter (live + result) ---------- */
.meter{position:relative}
.meter-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--s500);letter-spacing:.01em}
.meter-labels span{display:flex;align-items:center;gap:6px}
.meter-labels i{width:8px;height:8px;border-radius:99px;display:inline-block}
.meter-track{position:relative;height:10px;border-radius:99px;margin-top:10px;background:linear-gradient(90deg,rgb(24 144 255 / .55),rgb(24 144 255 / .12) 35%,rgb(255 255 255 / .7) 35%,rgb(255 255 255 / .7) 65%,rgb(51 65 85 / .14) 65%,rgb(51 65 85 / .6))}
.meter-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--s400);opacity:.5}
.meter-knob{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px rgb(15 23 42 / .08),0 4px 10px -2px rgb(15 23 42 / .3);transition:left .9s var(--ease);z-index:2}
.meter-knob::after{content:"";position:absolute;inset:6px;border-radius:99px;background:var(--s700);transition:background .4s}
.meter-knob.c::after{background:var(--c-contractor)}
.meter-zones{display:flex;margin-top:8px;font-size:11px;color:var(--s500);font-weight:500}
.meter-zones span{text-align:center}
.live{max-width:720px;margin:22px auto 0;padding:16px 22px 14px;border-radius:var(--r-3xl)}
.live .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.live .cap b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--s500);font-weight:600}
.live .cap span{font-size:12.5px;color:var(--s500);font-variant-numeric:tabular-nums;transition:opacity .3s}

/* ---------- Question deck (ui/Stepper.tsx stack) ---------- */
.qwrap{max-width:760px;margin:0 auto;padding:36px 32px 0}
.deck{position:relative;margin-top:32px}
.deck .ghost{position:absolute;border-radius:22px 22px 0 0;background:rgb(255 255 255 / .4);transition:all .6s var(--ease)}
.deck .g1{left:5%;right:5%;top:-13px;height:13px;opacity:.85}
.deck .g2{left:10%;right:10%;top:-25px;height:12px;opacity:.5;border-radius:20px 20px 0 0}
.deck[data-left="1"] .g2,.deck[data-left="0"] .g2{opacity:0;top:-13px}
.deck[data-left="0"] .g1{opacity:0;top:0}
.qcard{position:relative;padding:28px 36px 30px;min-height:562px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qhead .back{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:var(--pill);background:rgb(255 255 255 / .4);border:1px solid var(--s200);font-size:13.5px;font-weight:500;color:var(--s700);transition:background .2s}
.qhead .back:hover{background:#fff}
.qhead .back svg{width:14px;height:14px}
.prog{display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:220px}
.prog .lbl{font-size:13px;font-weight:500;color:var(--s500);transition:opacity .3s}
.prog .track{width:100%;height:6px;border-radius:99px;background:rgb(51 65 85 / .12);overflow:hidden}
.prog .fill{display:block;height:100%;width:8%;border-radius:99px;background:var(--s700);transition:width .8s var(--ease)}
.qcontent{margin-top:34px;text-align:center}
.qcontent.out{animation:qOut .2s ease-in both}
.qcontent.in{animation:qIn .5s var(--ease) both}
.qcontent.out.rev{animation-name:qOutRev}
.qcontent.in.rev{animation-name:qInRev}
@keyframes qOut{to{opacity:0;transform:translateY(-18px)}}
@keyframes qIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes qOutRev{to{opacity:0;transform:translateY(18px)}}
@keyframes qInRev{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
.qcat{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--s500)}
.qtitle{font-size:32px;line-height:1.18;font-weight:700;letter-spacing:-.03em;margin-top:10px;text-wrap:balance;color:var(--s700)}
.qhelp{font-size:15px;color:var(--s500);margin-top:10px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;text-align:left}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;background:#fff;border:1px solid var(--s200);border-radius:var(--r-2xl);padding:20px 20px 22px;min-height:132px;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.opt:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgb(15 23 42 / .25);border-color:var(--s300)}
.opt .dot{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--s300);display:grid;place-items:center;margin-bottom:12px;transition:all .2s}
.opt .dot svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .2s}
.opt .main{font-size:17px;font-weight:600;color:var(--s700);line-height:1.3;letter-spacing:-.01em}
.opt .detail{font-size:14.5px;color:var(--s500);line-height:1.45}
.opt .key{position:absolute;right:16px;top:16px;font-size:11px;font-weight:600;color:var(--s400);border:1px solid var(--s200);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center}
.opt.sel{border-color:var(--s700);box-shadow:0 0 0 3px rgb(51 65 85 / .15)}
.opt.sel .dot{background:var(--s700);border-color:var(--s700)}
.opt.sel .dot svg{opacity:1}
.qfoot{display:flex;justify-content:center;margin-top:16px}
.notsure{background:transparent;border:0;border-radius:var(--pill);padding:8px 16px;font-size:14px;font-weight:500;color:var(--s500);text-decoration:underline;text-decoration-color:var(--s300);text-underline-offset:4px;transition:color .2s,background .2s}
.notsure:hover{color:var(--s700);background:rgb(255 255 255 / .5)}
.notsure.sel{color:var(--s700);background:#fff;text-decoration:none}
.why{margin:22px auto 0;max-width:560px}
.why summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--s500);padding:4px 8px;border-radius:var(--pill)}
.why summary::-webkit-details-marker{display:none}
.why summary:hover{color:var(--s700)}
.why summary svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.why[open] summary svg.chev{transform:rotate(180deg)}
.why-body{margin-top:10px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--s600);text-align:left;animation:viewIn .3s var(--ease) both}
.why-body a{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-weight:500;font-size:13.5px}
.why-body a svg{width:12px;height:12px}
.kbd{margin-top:22px;font-size:12px;color:var(--s400)}
.kbd kbd{font-family:inherit;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--s200);border-radius:5px;padding:1px 6px;color:var(--s500)}

/* State picker */
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--s200);border-radius:var(--r-2xl);padding:14px 16px;text-align:left;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.st:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgb(15 23 42 / .25);border-color:var(--s300)}
.st b{font-size:15px;font-weight:600;color:var(--s700)}
.st span{font-size:12px;color:var(--s500)}
.st.abc span{color:var(--blue-600);font-weight:500}
.st.sel{border-color:var(--s700);box-shadow:0 0 0 3px rgb(51 65 85 / .15)}
.other-state{position:relative;margin-top:12px}
.other-state select{appearance:none;-webkit-appearance:none;width:100%;height:var(--h-md);border-radius:var(--pill);border:1px solid var(--s200);background:rgb(255 255 255 / .6);padding:0 44px 0 20px;font:inherit;font-size:15px;color:var(--s700);font-weight:500}
.other-state select:hover{background:#fff}
.other-state select:focus{outline:none;border-color:var(--s700);background:#fff}
.other-state svg{position:absolute;right:18px;top:50%;margin-top:-7px;width:14px;height:14px;color:var(--s500);pointer-events:none}

/* Weighing interstitial */
.weigh{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;gap:18px}
.weigh-txt{font-size:18px;font-weight:500;color:var(--s500);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- Result ---------- */
.rwrap{max-width:780px;margin:0 auto;padding:8px 32px 0}
body.is-result .footer{display:none}
.result{padding:32px 48px 30px;text-align:center}
.r-label{font-size:13px;font-weight:500;color:var(--s500)}
.r-title{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.045em;margin-top:10px;color:var(--s700)}
.r-title small{font-size:.42em;font-weight:600;color:var(--s500);letter-spacing:-.01em;margin-left:4px;vertical-align:.35em}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:#fff;border:1px solid var(--s200);border-radius:var(--pill);padding:5px 13px;font-size:13.5px;font-weight:600;color:var(--s600);font-variant-numeric:tabular-nums}
.chip i{width:7px;height:7px;border-radius:9px;background:var(--c-employee)}
.chip.c i{background:var(--c-contractor)}
.chip.m i{background:var(--s400)}
.r-meter{margin-top:22px;padding:18px 20px 12px;text-align:left}
.r-advice{font-size:17px;line-height:1.55;color:var(--s600);margin:20px auto 0;max-width:580px;text-wrap:balance}
.divider{display:flex;align-items:center;gap:14px;margin:24px 0 14px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--s500)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgb(100 116 139 / .28)}
.options2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.tile{border-radius:var(--r-3xl);padding:24px 26px;display:flex;flex-direction:column;position:relative}
.tile h2{font-size:18px;font-weight:700;letter-spacing:-.02em}
.tile ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.tile li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--s600)}
.tile li svg{width:15px;height:15px;flex:none;margin-top:3px}
.tile-diy{background:rgb(255 255 255 / .4);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);border:1px solid rgb(255 255 255 / .35);margin:8px 0}
.tile-diy li{color:var(--s500)}
.tile-diy li svg{color:var(--s400)}
.tile-wg{background:#fff;border:1px solid var(--s200);box-shadow:0 20px 40px -18px rgb(15 23 42 / .35),var(--shadow-md)}
.tile-wg .wg-logo{position:absolute;top:27px;right:26px;height:16px;width:auto;color:var(--brand-navy)}
.tile-wg li svg{color:var(--s700)}
.tile-wg .btn{margin-top:auto;width:100%;padding-left:20px;padding-right:20px;white-space:nowrap;gap:10px}
.tile .disclose{font-size:12.5px;color:var(--s500);margin-top:3px}
.quiet-link{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--s700);text-decoration:underline;text-decoration-color:var(--s300);text-underline-offset:5px}
.quiet-link:hover{color:var(--s900);text-decoration-color:var(--s700)}
.quiet-link svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.quiet-link:hover svg{transform:translateX(3px)}
.tile-wg ul{margin-bottom:20px}
.r-foot{text-align:center;margin-top:20px;font-size:12.5px;color:var(--s500)}
.r-foot button{background:none;border:0;padding:4px 6px;font-size:14px;font-weight:500;color:var(--s700);text-decoration:underline;text-decoration-color:var(--s400);text-underline-offset:4px;display:inline-flex;align-items:center;gap:6px}
.r-foot button:hover{text-decoration-color:var(--s700)}

<script>
/* =====================================================================
   MODEL (SPEC.md v2): evidence points / log-odds, early stop
   ===================================================================== */
const STATES = [["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]];
const STATE_NAME = Object.fromEntries(STATES);
const stateIn = c => c === "DC" ? "the District of Columbia" : STATE_NAME[c];
const ABC_STATES = ["CA","MA","NJ","IL"];
const isABC = c => ABC_STATES.includes(c);
const PRIOR_ABC = 0.6;
const STOP_AT = 2.2, MIN_FACTORS = 2, CAP = 97;

const QUESTIONS = [
 {n:1, cat:"Control", title:"Who decides how the work gets done?", short:"Who controls the work",
  a:["We do","We set the methods, steps, and hours"], b:["They do","We agree on the result and the deadline"],
  eA:1.6, eB:-1.2, basis:"IRS behavioral control · DOL core factor · ABC prong A",
  why:"Control over how work is done is the heart of the IRS behavioral test and one of the two core factors in the Department of Labor's 2026 proposed rule.",
  src:["IRS: Behavioral control","https://www.irs.gov/businesses/small-businesses-self-employed/behavioral-control"]},
 {n:2, cat:"Your business", title:"Is this work part of what your company normally does or sells?", short:"Part of your core business",
  a:["Yes, it's core to our business","e.g. a developer at a software company"], b:["No, it's outside our usual business","e.g. a plumber at a software company"],
  eA:1.0, eA_abc:2.0, eB:-0.8, basis:"ABC prong B · DOL integral work",
  why:"Under ABC tests, work in your usual line of business points strongly to employment. In California and Massachusetts this factor alone is close to decisive.",
  src:["California Labor Code 2775","https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2775"]},
 {n:3, cat:"Independence", title:"Do they run their own business?", short:"Own business",
  a:["No, they mainly work for us","Paid for their time, we cover the costs"], b:["Yes, with other clients","They set their price and carry their own costs"],
  eA:1.4, eB:-1.6, basis:"ABC prong C · DOL core factor (profit or loss) · IRS financial control",
  why:"ABC prong C asks whether the worker runs an independent business of the same kind, and the DOL's second core factor asks whether they can make or lose money through their own decisions.",
  src:["DOL 2026 proposed rule","https://www.federalregister.gov/documents/full_text/text/2026/02/27/2026-03962.txt"]},
 {n:4, cat:"Duration", title:"Is this an ongoing role or a project?", short:"Ongoing or project",
  a:["Ongoing, no set end","An open-ended engagement"], b:["A project with an end date","A defined scope that finishes"],
  eA:0.9, eB:-0.7, basis:"IRS relationship (permanency) · DOL permanence",
  why:"An ongoing, open-ended relationship is a classic sign of employment for both the IRS and the DOL.",
  src:["IRS: Type of relationship","https://www.irs.gov/businesses/small-businesses-self-employed/type-of-relationship"]}
];
const evidenceFor = (q, a, st) => a === "A" ? (isABC(st) && q.eA_abc ? q.eA_abc : q.eA) : a === "B" ? q.eB : 0;
const logistic = L => 1 / (1 + Math.exp(-L));

/* Pure scoring function. answers: {1:'A'|'B'|'N', ...}. Answers after the stop point are ignored. */
function evaluate(st, answers){
  const prior = isABC(st) ? PRIOR_ABC : 0;
  let L = prior, asked = 0, stopped = false;
  const rows = [];
  for (const q of QUESTIONS){
    const a = answers[q.n];
    if (!a) break;
    const E = evidenceFor(q, a, st);
    L += E; asked++;
    rows.push({q, a, E});
    if (asked >= MIN_FACTORS && Math.abs(L) >= STOP_AT){ stopped = true; break; }
  }
  const done = stopped || asked === QUESTIONS.length;
  const p = logistic(L);
  const verdict = p >= 0.65 ? "employee" : p <= 0.35 ? "contractor" : "close";
  const notSure = rows.filter(r => r.a === "N").length;
  const baseConf = Math.min(CAP, Math.round(Math.max(p, 1 - p) * 100));
  const confidence = Math.max(50, baseConf - 5 * notSure);
  const risk = Math.min(CAP, Math.max(100 - CAP, Math.round(p * 100)));
  return {st, prior, L, p, asked, stopped, done, rows, verdict, notSure, baseConf, confidence, risk};
}

/* Expected number of further factor questions, enumerating every future answer path
   (A 0.45, B 0.45, Not sure 0.10) through the real early-stop logic. At most 3^4 = 81 paths. */
const P_ANS = {A:0.45, B:0.45, N:0.10};
function expectedRemaining(st, answers){
  const r = evaluate(st, answers);
  if (r.done) return 0;
  const next = r.asked + 1;
  let e = 0;
  for (const [v, p] of Object.entries(P_ANS)) e += p * (1 + expectedRemaining(st, {...answers, [next]: v}));
  return e;
}
const PROG_BASE = 0.08;
/* Raw progress toward a decision: answered / (answered + E). The state screen counts as half a step. */
function rawProgress(st, answers){
  if (!st) return PROG_BASE;
  const r = evaluate(st, answers);
  if (r.done) return 1;
  const E = expectedRemaining(st, answers), n = r.asked;
  return n === 0 ? Math.max(PROG_BASE, 0.5 / (0.5 + E)) : n / (n + E);
}

/* Progress bar: monotonic along the path (max with the previous step), recomputed per step on Back */
function setProgress(v){
  $("#progFill").style.width = (v * 100).toFixed(1) + "%";
  $("#prog").setAttribute("aria-valuenow", Math.round(v * 100));
  $("#progLbl").textContent = v >= 0.7 ? "Almost there" : v >= 0.35 ? "Getting clearer" : "Getting started";
}
function paintChrome(justAnswered = 0){
  const cur = S.step;
  const upto = Math.max(0, cur - 1 + justAnswered);
  const sub = {}; for (const q of QUESTIONS) if (q.n <= upto && S.answers[q.n]) sub[q.n] = S.answers[q.n];
  const r = evaluate(S.st, sub);
  const prev = upto > 0 ? (S.hist[upto - 1] || 0) : 0;
  S.hist[upto] = Math.max(prev, rawProgress(S.st, sub));
  setProgress(S.hist[upto]);
  const left = cur === 0 ? 2 : Math.min(2, QUESTIONS.length - cur);
  $("#deck").dataset.left = left;
  // live meter
  if (S.st){
    setKnob("liveKnob", r.p);
    const lean = r.p >= .65 ? "Leaning W-2 employee" : r.p <= .35 ? "Leaning 1099 contractor" : "Balanced so far";
    $("#liveTxt").textContent = cur <= 1 && !r.rows.length ? (isABC(S.st) ? `${STATE_NAME[S.st]} starts on the employee side` : "Neutral starting point") : lean;
  } else { setKnob("liveKnob", .5); $("#liveTxt").textContent = "Pick a state to begin"; }
}
function paintStep(dir){

}

function questionHTML(q){

let busy = false;
function bindStep(){
  document.querySelectorAll("#qc [data-st]").forEach(b => b.addEventListener("click", () => pickState(b.dataset.st, b)));
  const sel = $("#otherSel"); if (sel) sel.addEventListener("change", () => sel.value && pickState(sel.value));

}
function mark(el){ document.querySelectorAll("#qc .sel").forEach(x => x.classList.remove("sel")); el && el.classList.add("sel"); }
function pickState(c, el){
  if (busy) return; busy = true;
  S.st = c; mark(el); paintChrome();
  setTimeout(() => { busy = false; S.step = 1; paintStep(1); }, 420);
}
function answer(v){
  if (busy || S.step === 0) return; busy = true;
  const q = QUESTIONS[S.step - 1];
  // changing an earlier answer invalidates later ones
  if (S.answers[q.n] !== v) for (const k of QUESTIONS) if (k.n > q.n) delete S.answers[k.n];
  S.answers[q.n] = v;
  mark(document.querySelector(`#qc [data-v="${v}"]`));
  paintChrome(1);
  const r = evaluate(S.st, S.answers);
  setTimeout(() => {
    busy = false;
    if (r.done) weigh(r); else { S.step++; paintStep(1); }
  }, 420);
}
function back(){

}
document.addEventListener("keydown", e => {
  if (!document.getElementById("qc") || S.step === 0 || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  const m = {a:"B", b:"A", n:"N"}[e.key.toLowerCase()]; // keys follow screen position
  if (m) answer(m);
});
function weigh(r){
  const qc = $("#qc");
  qc.className = "qcontent out";
  setProgress(1);
  $("#deck").dataset.left = 0;
  setTimeout(() => {
    qc.className = "qcontent in";
    qc.innerHTML = `<div class="weigh"><div class="weigh-txt">Weighing your answers</div></div>`;
    setTimeout(() => renderResult(r), 800);
  }, 200);
}

/* ---------- Result ---------- */
function renderResult(r){
  const o = OPTIONS[r.verdict], [v, tag] = VERDICT[r.verdict];
  const chipCls = {employee:"", close:"m", contractor:"c"}[r.verdict];
  swapView(`<section class="view rwrap">
    <div class="glass result">
      <div class="r-label">Your result · ${esc(STATE_NAME[r.st])}</div>
      <h1 class="r-title">${esc(v)}${tag ? ` <small>${tag}</small>` : ""}</h1>
      <span class="chip ${chipCls}"><i></i>${r.confidence}% sure</span>
      <div class="r-meter nested">${meterHTML("resKnob", .5)}</div>
      <p class="r-advice">${esc(adviceFor(r))}</p>
    </div>
    <div class="divider"><span>Your options</span></div>
    <div class="options2">
      <div class="tile tile-diy">
        <h2>${esc(o.diy[0])}</h2>
        <ul>${o.diy[1](stateIn(r.st)).map(t => `<li>${ic("i-dot")}${esc(t)}</li>`).join("")}</ul>
      </div>
      <div class="tile tile-wg">
        ${LOGO}
        <h2>Use WorkGenius</h2>
        <p class="disclose">From WorkGenius, who built this check</p>
        <ul>${o.wg.map(t => `<li>${ic("i-check")}${esc(t)}</li>`).join("")}</ul>
        ${o.button
          ? `<a class="btn btn-primary btn-lg" href="${ctaUrl(o.url, r)}" target="_blank" rel="noopener">${esc(o.button(STATE_NAME[r.st]))}${ic("i-arrow","i arrow")}</a>`
          : `<a class="quiet-link" href="${ctaUrl(o.url, r)}" target="_blank" rel="noopener">${esc(o.link)}${ic("i-arrow","i arrow")}</a>`}
      </div>
    </div>
    <div class="r-foot">
      <button type="button" id="restartBtn">${ic("i-restart")}Start over</button>
      <p>An estimate based on your answers, not legal advice.</p>
    </div>
  </section>`, () => {
    setTimeout(() => setKnob("resKnob", r.p), 350);
    $("#restartBtn").addEventListener("click", renderIntro);
  }, "is-result");
}

/* ---------- Demo hook: ?demo=employee|close|contractor ---------- */
const DEMOS = {
  employee:{st:"CA", answers:{1:"A",2:"A"}},                 // stops after 2
  close:{st:"NY", answers:{1:"B",2:"A",3:"A",4:"B"}},        // all 4, L = +0.5
  contractor:{st:"TX", answers:{1:"B",2:"B",3:"B"}}          // stops after 3
};
$("#homeBtn").addEventListener("click", renderIntro);
const demo = new URLSearchParams(location.search).get("demo");
if (DEMOS[demo]){ S.st = DEMOS[demo].st; S.answers = {...DEMOS[demo].answers}; renderResult(evaluate(S.st, S.answers)); }
else renderIntro();
window.WG = {evaluate, QUESTIONS, DEMOS};
</script>
