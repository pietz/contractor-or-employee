<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contractor or employee? A 1-minute check for US companies | WorkGenius</title>
<meta name="description" content="Answer up to 7 quick questions based on IRS, Department of Labor and state ABC tests. Most checks take under a minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Blue Frost tokens (WorkGenius design system: tailwind.css @theme + themes.css :root)
   ===================================================================== */
:root{
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8;
  --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --brand-navy:#072F47;                 /* logo */
  --blue-50:#d0e8ff; --blue-100:#bbdeff; --blue-200:#92cbff; --blue-400:#41a4ff; --blue-500:#1890ff; --blue-600:#0074df; --blue-700:#0057a7;
  --frost:#C8DBFF;                      /* radial page glow */
  --bg-primary:#334155; --primary-hover:#1e293b; --primary-pressed:#0f172a;
  --text-strong:#334155; --text-secondary:#64748b; --text-tertiary:#94a3b8; --text-link:#0369a1;
  --glass:rgb(255 255 255 / .4); --glass-nested:rgb(248 250 252 / .5); --card:#fff;
  --blur-glass:32px;
  --border:#cbd5e1;
  --success-bg:#f0fdf4; --success-text:#15803d; --success-border:#22c55e;
  --warning-bg:#fffbeb; --warning-text:#b45309; --warning-border:#f59e0b;
  --danger-bg:#fef2f2;  --danger-text:#b91c1c;  --danger-border:#ef4444;
  --info-bg:#f0f9ff; --info-text:#0369a1;
  --r-md:6px; --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-3xl:24px; --pill:9999px;
  --h-sm:2.5rem; --h-md:3rem; --h-lg:3.5rem;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05); --shadow-md:0 4px 6px -1px rgb(0 0 0 / .1); --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .15);
  --ease:cubic-bezier(.22,1,.36,1);
  /* Evidence colors: 1099 side in brand blue, W-2 side in primary slate */
  --c-contractor:#1890ff; --c-employee:#334155;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text-strong);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:var(--s300);min-height:100vh;display:flex;flex-direction:column;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 120% 85% at 50% 100%,var(--frost) 0%,var(--s300) 65%)}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;color:var(--text-strong);letter-spacing:-.02em}
p{margin:0}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--s700);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none}

/* ---------- Glass surfaces (Card / Stepper) ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur-glass));backdrop-filter:blur(var(--blur-glass));border-radius:var(--r-3xl);border:1px solid rgb(255 255 255 / .35)}
.nested{background:var(--glass-nested);border-radius:var(--r-2xl)}

/* ---------- Buttons (freelancer ui/Button.tsx) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:var(--h-md);padding:8px 32px;border:1px solid;border-radius:var(--pill);font-weight:500;font-size:16px;line-height:1.3;text-align:center;transition:background .2s,border-color .2s,transform .2s var(--ease),box-shadow .2s;text-decoration:none !important}
.btn .i{font-size:15px;transition:transform .25s var(--ease)}
.btn:hover .i.arrow{transform:translateX(3px)}
.btn-primary{background:var(--s700);color:#fff;border-color:var(--s700)}
.btn-primary:hover{background:var(--s600);border-color:var(--s600);color:#fff}
.btn-primary:active{background:var(--primary-pressed)}
.btn-default{background:#fff;color:var(--s700);border-color:var(--s200)}
.btn-default:hover{background:var(--s50);color:var(--s700)}
.btn-faded{background:rgb(255 255 255 / .4);color:var(--s700);border-color:var(--s200)}
.btn-faded:hover{background:var(--s50)}
.btn-sm{min-height:var(--h-sm);padding:6px 18px;font-size:14px;gap:8px}
.btn-lg{min-height:var(--h-lg);padding:10px 36px;font-size:17px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- Rainbow highlight (ui/RainbowHighlight.tsx) ---------- */
@property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.rainbow{position:relative;isolation:isolate}
.rainbow::before{content:"";position:absolute;inset:-3px;z-index:-1;border-radius:inherit;background:conic-gradient(from var(--angle) at 50% 50%,#ffc876,#79fff7,#ff71f5,#ffc876);filter:blur(18px);opacity:.6;animation:spin 4s linear infinite}
@keyframes spin{to{--angle:360deg}}

/* ---------- Chrome ---------- */
.topbar{position:relative;z-index:5}
.topbar-in{max-width:1180px;margin:0 auto;height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.toolname{display:flex;align-items:center;gap:10px;background:rgb(255 255 255 / .4);border:0;border-radius:var(--pill);padding:6px 16px 6px 6px;font-size:14px;font-weight:600;color:var(--s700);transition:background .2s}
.toolname:hover{background:rgb(255 255 255 / .6)}
.toolname .m{width:28px;height:28px;border-radius:999px;background:var(--s700);color:#fff;display:grid;place-items:center}
.toolname .m svg{width:15px;height:15px}
.byline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--s500);font-weight:500;transition:opacity .4s}
.byline .wg-logo{height:22px;width:auto;color:var(--s500);transition:color .4s}
body:not(.is-result) .byline{opacity:.75}
body.is-result .byline .wg-logo{color:var(--brand-navy)}
.byline a{display:flex}
main{flex:1;position:relative}
.footer{padding:28px 32px 32px;text-align:center;font-size:12px;color:var(--s500)}
.footer a{color:var(--s500)}

/* ---------- Views + transitions ---------- */
.view{animation:viewIn .5s var(--ease) both}
.view.leaving{animation:viewOut .22s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- Intro ---------- */
.intro{max-width:880px;margin:0 auto;padding:64px 32px 0;text-align:center}
.pill-note{display:inline-flex;align-items:center;gap:8px;background:rgb(255 255 255 / .4);border-radius:var(--pill);padding:6px 14px 6px 8px;font-size:13px;font-weight:500;color:var(--s600)}
.pill-note b{background:#fff;color:var(--s700);font-weight:600;border-radius:var(--pill);padding:2px 9px;font-size:12px}
.intro h1{font-size:68px;line-height:1.02;font-weight:700;letter-spacing:-.045em;margin-top:22px;color:var(--s700)}
.intro .lede{font-size:19px;line-height:1.6;color:var(--s500);max-width:620px;margin:20px auto 0}
.fork{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;max-width:720px;margin:44px auto 0;text-align:left}
.fork-card{display:flex;align-items:center;gap:16px;border:0;border-radius:var(--r-3xl);padding:22px 22px 22px 22px;text-align:left;transition:transform .25s var(--ease),background .2s}
.fork-card:hover{transform:translateY(-2px)}
.fork-main{background:rgb(241 245 249 / .92)}
.fork-main:hover{background:#fff}
.fork-alt{background:rgb(255 255 255 / .4);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px)}
.fork-alt:hover{background:rgb(255 255 255 / .6)}
.fork-ic{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;flex:none}
.fork-main .fork-ic{background:var(--s700);color:#fff}
.fork-alt .fork-ic{background:rgb(255 255 255 / .6);color:var(--s600);border:1px solid var(--s200)}
.fork-ic svg{width:20px;height:20px}
.fork-card b{display:block;font-size:17px;font-weight:600;color:var(--s700);letter-spacing:-.01em}
.fork-card span.s{display:block;font-size:14px;color:var(--s500);margin-top:2px}
.fork-card .go{margin-left:auto;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--s700);background:#fff;border:1px solid var(--s200);flex:none;transition:transform .25s var(--ease)}
.fork-card:hover .go{transform:translateX(3px)}
.fork-card .go svg{width:15px;height:15px}
.worker-note{max-width:720px;margin:14px auto 0;text-align:left;padding:20px 22px;font-size:14.5px;color:var(--s600);line-height:1.6;animation:viewIn .35s var(--ease) both}
.worker-note b{color:var(--s700)}
.worker-note .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.trust{list-style:none;padding:0;margin:40px auto 0;display:flex;justify-content:center;flex-wrap:wrap;gap:10px 26px;font-size:13.5px;color:var(--s600);font-weight:500}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:16px;height:16px;color:var(--s700)}
.intro-demo{margin:56px auto 0;max-width:560px}

/* ---------- Evidence meter (live + result) ---------- */
.meter{position:relative}
.meter-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--s500);letter-spacing:.01em}
.meter-labels span{display:flex;align-items:center;gap:6px}
.meter-labels i{width:8px;height:8px;border-radius:99px;display:inline-block}
.meter-track{position:relative;height:10px;border-radius:99px;margin-top:10px;background:linear-gradient(90deg,rgb(24 144 255 / .55),rgb(24 144 255 / .12) 35%,rgb(255 255 255 / .7) 35%,rgb(255 255 255 / .7) 65%,rgb(51 65 85 / .14) 65%,rgb(51 65 85 / .6))}
.meter-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--s400);opacity:.5}
.meter-knob{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px rgb(15 23 42 / .08),0 4px 10px -2px rgb(15 23 42 / .3);transition:left .9s var(--ease);z-index:2}
.meter-knob::after{content:"";position:absolute;inset:6px;border-radius:99px;background:var(--s700);transition:background .4s}
.meter-knob.c::after{background:var(--c-contractor)}
.meter-zones{display:flex;margin-top:8px;font-size:11px;color:var(--s500);font-weight:500}
.meter-zones span{text-align:center}
.live{max-width:720px;margin:22px auto 0;padding:16px 22px 14px;border-radius:var(--r-3xl)}
.live .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.live .cap b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--s500);font-weight:600}
.live .cap span{font-size:12.5px;color:var(--s500);font-variant-numeric:tabular-nums;transition:opacity .3s}

/* ---------- Question deck (ui/Stepper.tsx stack) ---------- */
.qwrap{max-width:760px;margin:0 auto;padding:36px 32px 0}
.deck{position:relative;margin-top:32px}
.deck .ghost{position:absolute;border-radius:22px 22px 0 0;background:rgb(255 255 255 / .4);transition:all .6s var(--ease)}
.deck .g1{left:5%;right:5%;top:-13px;height:13px;opacity:.85}
.deck .g2{left:10%;right:10%;top:-25px;height:12px;opacity:.5;border-radius:20px 20px 0 0}
.deck[data-left="1"] .g2,.deck[data-left="0"] .g2{opacity:0;top:-13px}
.deck[data-left="0"] .g1{opacity:0;top:0}
.qcard{position:relative;padding:28px 36px 30px;min-height:562px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qhead .back{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:var(--pill);background:rgb(255 255 255 / .4);border:1px solid var(--s200);font-size:13.5px;font-weight:500;color:var(--s700);transition:background .2s}
.qhead .back:hover{background:#fff}
.qhead .back svg{width:14px;height:14px}
.steps{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.steps .lbl{font-size:13px;color:var(--s500);font-variant-numeric:tabular-nums}
.steps .lbl b{color:var(--s700);font-weight:600}
.segs{display:flex;gap:4px}
.segs i{width:22px;height:4px;border-radius:99px;background:rgb(51 65 85 / .14);transition:background .4s}
.segs i.done{background:var(--s700)}
.segs i.cur{background:var(--s400)}
.segs i.skip{background:transparent;box-shadow:inset 0 0 0 1px var(--s300)}
.qcontent{margin-top:34px;text-align:center}
.qcontent.out{animation:qOut .2s ease-in both}
.qcontent.in{animation:qIn .5s var(--ease) both}
.qcontent.out.rev{animation-name:qOutRev}
.qcontent.in.rev{animation-name:qInRev}
@keyframes qOut{to{opacity:0;transform:translateY(-18px)}}
@keyframes qIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes qOutRev{to{opacity:0;transform:translateY(18px)}}
@keyframes qInRev{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
.qcat{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--s500)}
.qtitle{font-size:32px;line-height:1.18;font-weight:700;letter-spacing:-.03em;margin-top:10px;text-wrap:balance;color:var(--s700)}
.qhelp{font-size:15px;color:var(--s500);margin-top:10px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;text-align:left}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;background:#fff;border:1px solid var(--s200);border-radius:var(--r-2xl);padding:20px 20px 22px;min-height:132px;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.opt:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgb(15 23 42 / .25);border-color:var(--s300)}
.opt .dot{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--s300);display:grid;place-items:center;margin-bottom:12px;transition:all .2s}
.opt .dot svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .2s}
.opt .main{font-size:17px;font-weight:600;color:var(--s700);line-height:1.3;letter-spacing:-.01em}
.opt .detail{font-size:14.5px;color:var(--s500);line-height:1.45}
.opt .key{position:absolute;right:16px;top:16px;font-size:11px;font-weight:600;color:var(--s400);border:1px solid var(--s200);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center}
.opt.sel{border-color:var(--s700);box-shadow:0 0 0 3px rgb(51 65 85 / .15)}
.opt.sel .dot{background:var(--s700);border-color:var(--s700)}
.opt.sel .dot svg{opacity:1}
.qfoot{display:flex;justify-content:center;margin-top:16px}
.notsure{background:transparent;border:0;border-radius:var(--pill);padding:8px 16px;font-size:14px;font-weight:500;color:var(--s500);text-decoration:underline;text-decoration-color:var(--s300);text-underline-offset:4px;transition:color .2s,background .2s}
.notsure:hover{color:var(--s700);background:rgb(255 255 255 / .5)}
.notsure.sel{color:var(--s700);background:#fff;text-decoration:none}
.why{margin:22px auto 0;max-width:560px}
.why summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--s500);padding:4px 8px;border-radius:var(--pill)}
.why summary::-webkit-details-marker{display:none}
.why summary:hover{color:var(--s700)}
.why summary svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.why[open] summary svg.chev{transform:rotate(180deg)}
.why-body{margin-top:10px;padding:14px 16px;font-size:14px;line-height:1.55;color:var(--s600);text-align:left;animation:viewIn .3s var(--ease) both}
.why-body a{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-weight:500;font-size:13.5px}
.why-body a svg{width:12px;height:12px}
.kbd{margin-top:22px;font-size:12px;color:var(--s400)}
.kbd kbd{font-family:inherit;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--s200);border-radius:5px;padding:1px 6px;color:var(--s500)}

/* State picker */
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--s200);border-radius:var(--r-2xl);padding:14px 16px;text-align:left;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.st:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgb(15 23 42 / .25);border-color:var(--s300)}
.st b{font-size:15px;font-weight:600;color:var(--s700)}
.st span{font-size:12px;color:var(--s500)}
.st.abc span{color:var(--blue-600);font-weight:500}
.st.sel{border-color:var(--s700);box-shadow:0 0 0 3px rgb(51 65 85 / .15)}
.other-state{position:relative;margin-top:12px}
.other-state select{appearance:none;-webkit-appearance:none;width:100%;height:var(--h-md);border-radius:var(--pill);border:1px solid var(--s200);background:rgb(255 255 255 / .6);padding:0 44px 0 20px;font:inherit;font-size:15px;color:var(--s700);font-weight:500}
.other-state select:hover{background:#fff}
.other-state select:focus{outline:none;border-color:var(--s700);background:#fff}
.other-state svg{position:absolute;right:18px;top:50%;margin-top:-7px;width:14px;height:14px;color:var(--s500);pointer-events:none}

/* Weighing interstitial */
.weigh{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;gap:18px}
.shimmer{font-size:20px;font-weight:600;letter-spacing:-.01em;background:linear-gradient(90deg,var(--s500) 0%,var(--s500) 40%,#fff 50%,var(--s500) 60%,var(--s500) 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{from{background-position:200% center}to{background-position:-200% center}}
.twinkle{width:34px;height:34px;color:var(--s700);animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7) rotate(-8deg)}50%{opacity:1;transform:scale(1) rotate(0)}}

/* ---------- Result ---------- */
.rwrap{max-width:1080px;margin:0 auto;padding:16px 32px 0}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start;margin-top:16px}
.rcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.rside{position:sticky;top:16px}
.rise{animation:viewIn .6s var(--ease) both}
.verdict{padding:36px 40px 32px}
.v-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.v-kicker{font-size:13px;color:var(--s500);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.v-kicker .dotsep{width:3px;height:3px;background:var(--s400);border-radius:9px}
.v-title{font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.04em;margin-top:12px;color:var(--s700)}
.v-title .conf{color:var(--s500);font-weight:600;font-size:.62em;letter-spacing:-.02em;white-space:nowrap;vertical-align:.12em}
.v-copy{font-size:16.5px;line-height:1.6;color:var(--s600);margin-top:14px;max-width:640px}
.v-abc{margin-top:16px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:14.5px;line-height:1.55;color:var(--s600);max-width:680px}
.v-abc svg{width:18px;height:18px;flex:none;color:var(--blue-600);margin-top:2px}
.v-abc b{color:var(--s700)}
.confring{flex:none;width:100px;height:100px;position:relative}
.confring svg{width:100%;height:100%;transform:rotate(-90deg)}
.confring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.confring .num b{font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--s700);font-variant-numeric:tabular-nums;line-height:1}
.confring .num span{font-size:11px;color:var(--s500);font-weight:500;margin-top:4px}
.confring .arc{transition:stroke-dashoffset 1.4s var(--ease)}
.v-meter{margin-top:28px;padding:20px 22px 16px}
.risk{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--s600)}
.risk .badge{display:inline-flex;align-items:center;gap:8px;border-radius:var(--pill);padding:6px 14px;font-weight:600;font-size:14px;border:1px solid}
.risk .badge i{width:8px;height:8px;border-radius:9px;background:currentColor}
.risk .hi{background:var(--danger-bg);color:var(--danger-text);border-color:#fecaca}
.risk .mid{background:var(--warning-bg);color:var(--warning-text);border-color:#fde68a}
.risk .lo{background:var(--success-bg);color:var(--success-text);border-color:#bbf7d0}
.unsure-note{margin-top:10px;font-size:13.5px;color:var(--s500);display:flex;gap:8px;align-items:center}
.unsure-note svg{width:15px;height:15px}

.card{padding:28px 30px}
.card h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.card .sub{font-size:14px;color:var(--s500);margin-top:4px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--s500)}

/* Tug of war rows */
.tow-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 48px;gap:16px;margin-top:22px;font-size:11.5px;font-weight:600;color:var(--s500);letter-spacing:.02em}
.tow-head .axis{display:flex;justify-content:space-between}
.tow-head .axis span{display:flex;align-items:center;gap:6px}
.tow-head .axis i{width:8px;height:8px;border-radius:9px}
.tow{list-style:none;margin:10px 0 0;padding:0}
.tow li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 48px;gap:16px;align-items:center;padding:13px 0;border-top:1px solid rgb(148 163 184 / .25)}
.tow .lab b{display:block;font-size:14.5px;font-weight:600;color:var(--s700);line-height:1.3}
.tow .lab span{display:block;font-size:13px;color:var(--s500);margin-top:2px;line-height:1.35}
.bar{position:relative;height:14px}
.bar::before{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:1px;background:var(--s400);opacity:.55}
.bar::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:2px;background:rgb(255 255 255 / .6)}
.bar i{position:absolute;top:0;height:14px;border-radius:99px;width:0;transition:width .9s var(--ease);z-index:1}
.bar i.emp{left:50%;background:var(--c-employee);border-top-left-radius:2px;border-bottom-left-radius:2px}
.bar i.con{right:50%;background:var(--c-contractor);border-top-right-radius:2px;border-bottom-right-radius:2px}
.bar .zero{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:99px;border:2px solid var(--s400);background:var(--s100);z-index:1}
.tow .val{text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--s700)}
.tow .val.con{color:var(--blue-600)}
.tow .val.zero{color:var(--s400);font-weight:500}
.tow li.total{border-top:1px solid var(--s400)}
.tow li.total .lab{grid-column:1 / 3}
.tow li.total .lab b{font-size:15px}
.early{margin-top:14px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:13.5px;color:var(--s600);line-height:1.5}
.early svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--s500)}
.method{margin-top:10px;font-size:12.5px;color:var(--s500);line-height:1.55}

/* Stakes */
.stakes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stake{padding:16px 16px 14px}
.stake .fig{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--s700);line-height:1.15}
.stake p{font-size:13px;color:var(--s600);margin-top:6px;line-height:1.5}
.stake a{display:inline-block;margin-top:8px;font-size:12px;font-weight:500}
.fix{margin-top:12px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:14px;color:var(--s600);line-height:1.55;background:rgb(240 253 244 / .75);border-radius:var(--r-2xl)}
.fix svg{width:18px;height:18px;color:var(--success-text);flex:none;margin-top:1px}
.fix b{color:var(--s700)}

/* CTA handoff */
.cta-wrap{border-radius:var(--r-3xl)}
.cta{position:relative;border-radius:var(--r-3xl);background:rgb(241 245 249 / .94);padding:28px 26px 24px}
.cta .brand{display:flex;align-items:center;justify-content:space-between}
.cta .brand .wg-logo{height:22px;width:auto;color:var(--brand-navy)}
.cta .brand span{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--s500)}
.cta h3{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.025em;margin-top:22px}
.cta p{font-size:14.5px;line-height:1.6;color:var(--s600);margin-top:10px}
.cta ul{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.cta li{display:flex;gap:10px;font-size:14px;color:var(--s600);align-items:flex-start}
.cta li svg{width:15px;height:15px;color:var(--s700);flex:none;margin-top:3px}
.cta .btns{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.cta .btn{width:100%;padding-left:22px;padding-right:22px}

/* Memo */
.memo{padding:24px 26px}
.memo h2{font-size:17px}
.memo form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.input{width:100%;height:var(--h-md);border-radius:var(--pill);border:1px solid var(--s200);background:#fff;padding:0 20px;font:inherit;font-size:15px;color:var(--s700);transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:var(--s400)}
.input:focus{outline:none;border-color:var(--s700);box-shadow:0 0 0 3px rgb(51 65 85 / .12)}
.input.err{border-color:var(--danger-border);animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.errmsg{font-size:12.5px;color:var(--danger-text);padding-left:20px;margin-top:-4px}
.fine{font-size:12px;color:var(--s500);line-height:1.5;text-align:center}
.sent{margin-top:16px;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-2xl);background:rgb(240 253 244 / .85);animation:viewIn .4s var(--ease) both}
.sent .ok{width:32px;height:32px;border-radius:99px;background:var(--success-text);color:#fff;display:grid;place-items:center;flex:none}
.sent .ok svg{width:15px;height:15px}
.sent b{display:block;font-size:15px;color:var(--s700)}
.sent span{font-size:13.5px;color:var(--s600)}

.disclaimer{max-width:1080px;margin:16px auto 0;padding:0 32px}
.disclaimer .in{padding:20px 24px;font-size:12.5px;line-height:1.65;color:var(--s500)}
.disclaimer .acts{display:flex;justify-content:center;margin-top:18px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--s700);color:#fff;font-size:14px;font-weight:500;padding:12px 20px;border-radius:var(--pill);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before{animation:none !important;transition:none !important}}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .rgrid{display:flex;flex-direction:column}
  .rcol{display:contents}
  .rside{position:static}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}
}
@media (max-width:640px){
  .topbar-in{height:64px;padding:0 16px}
  .toolname span.t{display:none}
  .toolname{padding:6px}
  .byline .by{display:none}
  .byline .wg-logo{height:18px}
  .intro{padding:20px 20px 0}
  .intro h1{font-size:42px;margin-top:18px}
  .intro .lede{font-size:16.5px}
  .fork{grid-template-columns:1fr;margin-top:32px}
  .trust{flex-direction:column;align-items:flex-start;gap:10px;max-width:320px;margin-left:auto;margin-right:auto}
  .intro-demo{margin-top:36px}
  .qwrap{padding:16px 12px 0}
  .deck{margin-top:28px}
  .qcard{padding:18px 18px 22px;min-height:0}
  .qcontent{margin-top:24px}
  .qtitle{font-size:24px}
  .qhelp{font-size:14.5px}
  .options{grid-template-columns:1fr;gap:10px;margin-top:22px}
  .opt{min-height:0;padding:16px 16px 16px 54px}
  .opt .dot{position:absolute;left:16px;top:17px;margin:0}
  .opt .key,.kbd{display:none}
  .states{grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
  .live{margin:14px 0 0;padding:14px 16px 12px}
  .rwrap{padding:4px 12px 0}
  .verdict{padding:24px 20px 22px}
  .v-top{flex-direction:column-reverse;gap:16px}
  .confring{width:92px;height:92px}
  .confring .num b{font-size:24px}
  .v-title{font-size:30px}
  .v-copy{font-size:15.5px}
  .v-meter{padding:16px 14px 12px}
  .card{padding:22px 18px}
  .tow-head{grid-template-columns:1fr 44px;gap:10px}
  .tow-head .lh{display:none}
  .tow li{grid-template-columns:1fr 44px;gap:8px 10px}
  .tow .lab{grid-column:1 / -1}
  .tow li.total .lab{grid-column:1}
  .intro-demo .cap span{display:none}
  .stakes{grid-template-columns:1fr}
  .cta{padding:24px 20px 20px}
  .memo{padding:22px 18px}
  .disclaimer{padding:0 12px}
  .footer{padding:24px 20px 28px}
}
</style>
</head>

const STATES = [["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]];
const STATE_NAME = Object.fromEntries(STATES);
const stateIn = c => c === "DC" ? "the District of Columbia" : STATE_NAME[c];
const ABC_STATES = ["CA","MA","NJ","IL"];
const isABC = c => ABC_STATES.includes(c);
const PRIOR_ABC = 0.6;
const STOP_AT = 2.2, MIN_FACTORS = 2, CAP = 97;

const QUESTIONS = [
 {n:1, cat:"Control", title:"Who decides how the work gets done?", short:"Who controls the work",
  a:["We do","We set the methods, steps, and hours"], b:["They do","We agree on the result and the deadline"],
  eA:1.6, eB:-1.2, basis:"IRS behavioral control · DOL core factor · ABC prong A",
  why:"Control over how work is done is the heart of the IRS behavioral test and one of the two core factors in the Department of Labor's 2026 proposed rule.",
  src:["IRS: Behavioral control","https://www.irs.gov/businesses/small-businesses-self-employed/behavioral-control"]},
 {n:2, cat:"Your business", title:"Is this work part of what your company normally does or sells?", short:"Part of your core business",
  a:["Yes, it's core to our business","e.g. a developer at a software company"], b:["No, it's outside our usual business","e.g. a plumber at a software company"],
  eA:1.0, eA_abc:2.0, eB:-0.8, basis:"ABC prong B · DOL integral work",
  why:"Under ABC tests, work in your usual line of business points strongly to employment. In California and Massachusetts this factor alone is close to decisive.",
  src:["California Labor Code 2775","https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2775"]},
 {n:3, cat:"Independence", title:"Do they run their own business, with other clients?", short:"Own business and clients",
  a:["No, it's mainly us","We are their main or only client"], b:["Yes, their own business","They have their own business and other clients"],
  eA:1.0, eB:-1.4, basis:"ABC prong C · IRS financial control · DOL independent business",
  why:"ABC prong C asks whether the worker is customarily engaged in an independently established business of the same kind, and the DOL weighs this too.",
  src:["DOL Field Assistance Bulletin 2025-1","https://www.dol.gov/sites/dolgov/files/WHD/fab/fab2025-1.pdf"]},
 {n:4, cat:"Money", title:"How are they paid, and can they lose money?", short:"Pay and financial risk",
  a:["For their time","Hourly, weekly, or monthly"], b:["A fixed fee per project","They carry their own costs and risk"],
  eA:0.8, eB:-0.8, basis:"DOL core factor (profit or loss) · IRS financial control",
  why:"The chance to make or lose money through their own decisions is the second core factor in the DOL's proposed test and part of the IRS financial test.",
  src:["DOL 2026 proposed rule","https://www.federalregister.gov/documents/full_text/text/2026/02/27/2026-03962.txt"]},
 {n:5, cat:"History", title:"Have they (or anyone in this role) been your W-2 employee before?", short:"Former W-2 in this role",

  eA:1.6, eB:-0.2, basis:"IRS Section 530 consistency · strong red flag",

  src:["IRS: Section 530 relief","https://www.irs.gov/government-entities/worker-reclassification-section-530-relief"]},
 {n:6, cat:"Duration", title:"How long will this last?", short:"Length of the engagement",
  a:["Ongoing, no set end","An open-ended engagement"], b:["A defined project","With an end date"],
  eA:0.8, eB:-0.6, basis:"IRS relationship (permanency) · DOL permanence",
  why:"An ongoing, open-ended relationship is a classic sign of employment for both the IRS and the DOL.",
  src:["IRS: Type of relationship","https://www.irs.gov/businesses/small-businesses-self-employed/type-of-relationship"]}
];
const evidenceFor = (q, a, st) => a === "A" ? (isABC(st) && q.eA_abc ? q.eA_abc : q.eA) : a === "B" ? q.eB : 0;
const logistic = L => 1 / (1 + Math.exp(-L));

/* Pure scoring function. answers: {1:'A'|'B'|'N', ...}. Answers after the stop point are ignored. */
function evaluate(st, answers){
  const prior = isABC(st) ? PRIOR_ABC : 0;
  let L = prior, asked = 0, stopped = false;
  const rows = [];
  for (const q of QUESTIONS){
    const a = answers[q.n];
    if (!a) break;
    const E = evidenceFor(q, a, st);
    L += E; asked++;
    rows.push({q, a, E});
    if (asked >= MIN_FACTORS && Math.abs(L) >= STOP_AT){ stopped = true; break; }
  }
  const done = stopped || asked === QUESTIONS.length;
  const p = logistic(L);
  const verdict = p >= 0.65 ? "employee" : p <= 0.35 ? "contractor" : "close";
  const notSure = rows.filter(r => r.a === "N").length;
  const baseConf = Math.min(CAP, Math.round(Math.max(p, 1 - p) * 100));
  const confidence = Math.max(50, baseConf - 5 * notSure);
  const risk = Math.min(CAP, Math.max(100 - CAP, Math.round(p * 100)));
  return {st, prior, L, p, asked, stopped, done, rows, verdict, notSure, baseConf, confidence, risk};
}

    const seq = [.5,.72,.88,.62,.3,.14,.5]; let i = 0;
    clearInterval(renderIntro.t);
    renderIntro.t = setInterval(() => { if (!document.getElementById("introKnob")) return clearInterval(renderIntro.t); setKnob("introKnob", seq[i++ % seq.length]); }, 1600);
  }, "");
}

/* ---------- Flow ---------- */
function startFlow(){ S.st = ""; S.answers = {}; S.step = 0; renderFlow(); }
function renderFlow(){
  swapView(`<section class="view qwrap">
    <div class="deck" id="deck" data-left="2">
      <div class="ghost g2"></div><div class="ghost g1"></div>
      <div class="glass qcard">
        <div class="qhead">
          <button class="back" id="backBtn" type="button">${ic("i-back")}Back</button>
          <div class="steps"><span class="lbl" id="stepLbl"></span><span class="segs" id="segs">${QUESTIONS.map(()=>"<i></i>").join("")}</span></div>
        </div>
        <div class="qcontent in" id="qc"></div>
      </div>
    </div>
    <div class="glass live" id="live">
      <div class="cap"><b>Evidence so far</b><span id="liveTxt">Pick a state to begin</span></div>
      ${meterHTML("liveKnob", .5, {zones:false})}
    </div>
  </section>`, () => {
    $("#backBtn").addEventListener("click", back);
    paintStep(0);
  }, "");
}
function paintChrome(){
  const r = evaluate(S.st, S.answers);
  const cur = S.step;
  $("#stepLbl").innerHTML = cur === 0 ? `<b>Work state</b> · then up to 6 questions` : `Question <b>${cur}</b> of up to 6`;
  const segs = [...document.querySelectorAll("#segs i")];
  segs.forEach((s, i) => { s.className = i < cur - 1 ? "done" : i === cur - 1 ? "cur" : ""; });
  const left = cur === 0 ? 2 : Math.min(2, QUESTIONS.length - cur);
  $("#deck").dataset.left = left;
  // live meter
  if (S.st){
    setKnob("liveKnob", r.p);
    const lean = r.p >= .65 ? "Leaning W-2 employee" : r.p <= .35 ? "Leaning 1099 contractor" : "Balanced so far";
    $("#liveTxt").textContent = cur <= 1 && !r.rows.length ? (isABC(S.st) ? `${STATE_NAME[S.st]} starts on the employee side` : "Neutral starting point") : lean;
  } else { setKnob("liveKnob", .5); $("#liveTxt").textContent = "Pick a state to begin"; }
}
function paintStep(dir){
  const qc = $("#qc");
  const html = S.step === 0 ? stateHTML() : questionHTML(QUESTIONS[S.step - 1]);
  const put = () => {
    qc.className = "qcontent in" + (dir < 0 ? " rev" : "");
    qc.innerHTML = html;
    bindStep();
    paintChrome();
  };
  if (dir === 0){ put(); return; }
  qc.className = "qcontent out" + (dir < 0 ? " rev" : "");
  setTimeout(put, 200);
}
const QUICK = [["CA","ABC test"],["NY",""],["TX",""],["FL",""],["IL","ABC test"],["NJ","ABC test"],["MA","ABC test"],["WA",""]];
function stateHTML(){
  const quick = QUICK.map(([c,tag]) => `<button type="button" class="st ${tag?"abc":""} ${S.st===c?"sel":""}" data-st="${c}"><b>${STATE_NAME[c]}</b><span>${tag || "Common-law tests"}</span></button>`).join("");
  const others = STATES.filter(([c]) => !QUICK.some(q => q[0] === c));
  return `<div class="qcat">Location</div>
    <h2 class="qtitle">Where will they mainly work?</h2>
    <p class="qhelp">Some states presume employment, which changes the starting point.</p>
    <div class="states">${quick}</div>
    <div class="other-state"><label class="sr" for="otherSel">Another state</label>
      <select id="otherSel"><option value="">Another state or DC</option>${others.map(([c,n]) => `<option value="${c}" ${S.st===c?"selected":""}>${n}</option>`).join("")}</select>${ic("i-chev")}</div>
    ${whyHTML("California, Massachusetts, New Jersey and Illinois apply an ABC test that presumes the worker is an employee, so the company carries the burden of proof.", ["DOL: State UI law comparison, Table 1-4","https://oui.doleta.gov/unemploy/pdf/uilawcompar/2023/coverage.pdf"])}`;
}
function questionHTML(q){
  const cur = S.answers[q.n];
  const opt = (k, [m, d]) => `<button type="button" class="opt ${cur===k?"sel":""}" data-v="${k}" aria-pressed="${cur===k}">
    <span class="dot">${ic("i-check","")}</span><span class="key" aria-hidden="true">${k}</span>
    <span class="main">${esc(m)}</span><span class="detail">${esc(d)}</span></button>`;
  return `<div class="qcat">${esc(q.cat)}</div>
    <h2 class="qtitle">${esc(q.title)}</h2>
    <div class="options">${opt("A", q.a)}${opt("B", q.b)}</div>
    <div class="qfoot"><button type="button" class="notsure ${cur==="N"?"sel":""}" data-v="N">Not sure</button></div>
    ${whyHTML(q.why, q.src)}
    <p class="kbd">Press <kbd>A</kbd>, <kbd>B</kbd> or <kbd>N</kbd></p>`;
}
function whyHTML(text, [label, url]){
  return `<details class="why"><summary>${ic("i-info")}Why we ask${ic("i-chev","i chev")}</summary>
    <div class="why-body nested">${esc(text)}<br><a href="${url}" target="_blank" rel="noopener">${esc(label)}${ic("i-ext")}</a></div></details>`;
}
let busy = false;
function bindStep(){
  document.querySelectorAll("#qc [data-st]").forEach(b => b.addEventListener("click", () => pickState(b.dataset.st, b)));
  const sel = $("#otherSel"); if (sel) sel.addEventListener("change", () => sel.value && pickState(sel.value));
  document.querySelectorAll("#qc [data-v]").forEach(b => b.addEventListener("click", () => answer(b.dataset.v)));
}
function mark(el){ document.querySelectorAll("#qc .sel").forEach(x => x.classList.remove("sel")); el && el.classList.add("sel"); }
function pickState(c, el){
  if (busy) return; busy = true;
  S.st = c; mark(el); paintChrome();
  setTimeout(() => { busy = false; S.step = 1; paintStep(1); }, 420);
}
function answer(v){
  if (busy || S.step === 0) return; busy = true;
  const q = QUESTIONS[S.step - 1];
  // changing an earlier answer invalidates later ones
  if (S.answers[q.n] !== v) for (const k of QUESTIONS) if (k.n > q.n) delete S.answers[k.n];
  S.answers[q.n] = v;
  mark(document.querySelector(`#qc [data-v="${v}"]`));
  paintChrome();
  const r = evaluate(S.st, S.answers);
  setTimeout(() => {
    busy = false;
    if (r.done) weigh(r); else { S.step++; paintStep(1); }
  }, 420);
}
function back(){
  if (busy) return;
  if (S.step === 0){ renderIntro(); return; }
  S.step--; paintStep(-1);
}
document.addEventListener("keydown", e => {
  if (!document.getElementById("qc") || S.step === 0 || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  const m = {a:"A", b:"B", n:"N"}[e.key.toLowerCase()];
  if (m) answer(m);
});
function weigh(r){
  const qc = $("#qc");
  qc.className = "qcontent out";
  $("#segs").querySelectorAll("i").forEach((s, i) => s.className = i < r.asked ? "done" : "skip");
  $("#stepLbl").innerHTML = r.stopped ? `Decided after <b>${r.asked}</b> of 6` : `All <b>6</b> answered`;
  $("#deck").dataset.left = 0;
  setTimeout(() => {
    qc.className = "qcontent in";
    qc.innerHTML = `<div class="weigh"><svg class="twinkle"><use href="#i-sparkle"/></svg><div class="shimmer">Weighing the evidence</div></div>`;
    setTimeout(() => renderResult(r), 1100);
  }, 200);
}

/* ---------- Result ---------- */
function renderResult(r){
  const name = STATE_NAME[r.st], cta = CTA[r.verdict], utm = UTM(r.verdict);
  const maxE = 2.0;
  const confR = 50, confC = 2 * Math.PI * confR;
  const riskCls = {employee:"hi", close:"mid", contractor:"lo"}[r.verdict];
  const rows = [
    {lab:"Work state", ans:`${name}${isABC(r.st) ? " · ABC test" : ""}`, E:r.prior, basis:"", state:true},
    ...r.rows.map(x => ({lab:x.q.short, ans: x.a === "N" ? "Not sure" : x.a === "A" ? x.q.a[0] : x.q.b[0], E:x.E, n:x.a === "N"}))
  ];
  const rowHTML = (x, i) => `<li>
      <div class="lab"><b>${esc(x.lab)}</b><span>${esc(x.ans)}</span></div>
      <div class="bar">${x.E === 0 ? `<span class="zero" title="No evidence"></span>` : `<i class="${x.E > 0 ? "emp" : "con"}" data-w="${(Math.abs(x.E)/maxE*50).toFixed(1)}" style="transition-delay:${(.25 + i*.09).toFixed(2)}s"></i>`}</div>
      <div class="val ${x.E < 0 ? "con" : x.E === 0 ? "zero" : ""}">${x.E === 0 ? (x.n ? "Not sure" : "0") : sgn(x.E)}</div></li>`;
  const skipped = QUESTIONS.length - r.asked;

  swapView(`<section class="view rwrap">
    <div class="glass verdict rise">
      <div class="v-top">
        <div>
          <div class="v-kicker"><span>Your result</span><span class="dotsep"></span><span>Work in ${esc(name)}</span><span class="dotsep"></span><span>${r.asked + 1} answer${r.asked ? "s" : ""}</span></div>
          <h1 class="v-title">${esc(VERDICT[r.verdict]).replace(/\((W-2|1099)\)/, "<span style=\"white-space:nowrap\">($1)</span>")} <span class="conf">· ${r.confidence}% confidence</span></h1>
        </div>
        <div class="confring" aria-hidden="true">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${confR}" fill="none" stroke="rgb(255 255 255 / .7)" stroke-width="10"/>
            <circle class="arc" cx="60" cy="60" r="${confR}" fill="none" stroke="${r.verdict === "contractor" ? "var(--c-contractor)" : "var(--c-employee)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${confC.toFixed(1)}" stroke-dashoffset="${confC.toFixed(1)}" data-off="${(confC*(1-r.confidence/100)).toFixed(1)}"/></svg>
          <div class="num"><b id="confNum">0%</b><span>confidence</span></div>
        </div>
      </div>
      <p class="v-copy">${esc(verdictCopy(r))}</p>
      ${isABC(r.st) ? `<div class="v-abc nested">${ic("i-scale")}<span><b>ABC test state.</b> ${esc(ABC_LINE(r.st))}</span></div>` : ""}
      <div class="v-meter nested">${meterHTML("resKnob", .5)}</div>
      <div class="risk"><span>If you pay them as a 1099 contractor, misclassification risk:</span><span class="badge ${riskCls}"><i></i>${r.risk}%</span></div>
      ${r.notSure ? `<div class="unsure-note">${ic("i-info")}You weren't sure about ${r.notSure} question${r.notSure > 1 ? "s" : ""}, which adds no evidence and lowers confidence.</div>` : ""}
    </div>

    <div class="rgrid">
      <div class="rcol">
        <section class="glass card o3 rise" style="animation-delay:.08s">
          <div class="eyebrow">Why</div>
          <h2 style="margin-top:6px">How your answers pulled</h2>
          <p class="sub">Each answer adds evidence toward one side. Longer bars carry more weight in the official tests.</p>
          <div class="tow-head"><span class="lh">Factor · your answer</span><span class="axis"><span><i style="background:var(--c-contractor)"></i>1099 contractor</span><span>W-2 employee<i style="background:var(--c-employee)"></i></span></span><span style="text-align:right">Points</span></div>
          <ul class="tow">${rows.map(rowHTML).join("")}
            <li class="total"><div class="lab"><b>Net evidence</b><span>${r.p >= .5 ? `${Math.round(r.p*100)}% likely employee` : `${Math.round((1-r.p)*100)}% likely contractor`} (shown capped at ${CAP}%)</span></div><div class="val ${r.L < 0 ? "con" : ""}">${sgn(r.L)}</div></li>
          </ul>
          ${r.stopped ? `<div class="early nested">${ic("i-bolt")}<span>We stopped after ${r.asked} of 6 questions because the answers were already decisive. The ${skipped} remaining question${skipped > 1 ? "s" : ""} could not change the verdict enough.</span></div>` : ""}
          <p class="method">Weights follow the order the rules themselves use: the DOL's two core factors (control, and profit or loss) carry the most, and ABC states make core-business work close to decisive. "Not sure" adds no points but lowers confidence.</p>
        </section>

        <section class="glass card o4 rise" style="animation-delay:.16s">
          <div class="eyebrow">What's at stake</div>
          <h2 style="margin-top:6px">${r.verdict === "contractor" ? "If the role drifts toward employment" : "If a regulator reclassifies them"}</h2>
          <div class="stakes">
            <div class="stake nested"><div class="fig">~10.7%</div><p>of pay per year in back federal payroll taxes, for up to 3 open years (IRC 3509)</p><a href="https://www.law.cornell.edu/uscode/text/26/3509" target="_blank" rel="noopener">26 U.S.C. 3509</a></div>
            <div class="stake nested"><div class="fig">2×</div><p>unpaid minimum wage and overtime: back wages plus equal liquidated damages (FLSA)</p><a href="https://www.law.cornell.edu/uscode/text/29/216" target="_blank" rel="noopener">29 U.S.C. 216(b)</a></div>
            <div class="stake nested"><div class="fig">$5k to $25k</div><p>per violation for willful misclassification in California</p><a href="https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=226.8" target="_blank" rel="noopener">Cal. Labor Code 226.8</a></div>
          </div>
          <div class="fix">${ic("i-check")}<span><b>There is a fix.</b> The IRS Voluntary Classification Settlement Program lets eligible companies reclassify going forward for about 10% of one year's reduced-rate tax, with no interest or penalties. <a href="https://www.irs.gov/businesses/small-businesses-self-employed/voluntary-classification-settlement-program" target="_blank" rel="noopener">IRS: VCSP</a></span></div>
        </section>
      </div>

      <aside class="rcol rside">
        <div class="rainbow cta-wrap o2 rise" style="animation-delay:.05s">
          <section class="cta">
            <div class="brand"><svg class="wg-logo" viewBox="0 0 194 40" role="img" aria-label="WorkGenius" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M28.0382 1.3867C25.6812 0.46589 23.1728 0 20.5795 0C9.41669 0 0.334961 8.97186 0.334961 19.9996C0.334961 31.0281 9.41669 40 20.5795 40C31.7423 40 40.824 31.0281 40.824 19.9996C40.7962 15.3868 39.1652 10.8888 36.2316 7.33942L36.2301 7.33868C35.494 6.4442 34.1512 6.31256 33.2365 7.04906C33.0478 7.21581 32.8641 7.4206 32.7287 7.62027L24.8807 21.0594L22.3686 16.7333C21.784 15.7423 20.4727 15.3949 19.4533 15.9631C19.0626 16.1804 18.8306 16.4861 18.7048 16.704L16.1597 21.0214L13.6491 16.7355C13.0623 15.7423 11.7539 15.3949 10.7324 15.9631C9.72256 16.5453 9.37863 17.8033 9.95745 18.8214L14.3135 26.2785C14.6926 26.9236 15.4009 27.3244 16.1619 27.3244C16.9222 27.3244 17.6306 26.9236 18.0103 26.2771L20.5224 21.989L23.0345 26.2778C23.4136 26.9236 24.1219 27.3244 24.8829 27.3244C25.6432 27.3244 26.3515 26.9236 26.7313 26.2771L34.7652 12.5359L35.333 13.886C36.146 15.8205 36.5587 17.8684 36.5587 19.9718C36.5587 28.6848 29.3905 35.7733 20.5795 35.7733C11.7685 35.7733 4.59959 28.6848 4.59959 19.9718C4.59959 11.2589 11.7685 4.17034 20.5795 4.17034C22.5567 4.17034 24.5324 4.53676 26.4518 5.25937C27.5567 5.67991 28.7978 5.15844 29.2185 4.0972C29.4219 3.57426 29.4117 3.00159 29.1885 2.48962C28.9668 1.97985 28.5577 1.58783 28.0382 1.3867Z"/><path d="M65.8743 23.9905H65.9598L68.6673 11.174H72.3724L67.9548 29.8776H64.4208L60.9438 17.5118H60.8583L57.3812 29.8494H53.8757L49.4296 11.1458H53.1347L55.8422 23.9623H55.9277L59.4902 11.1458H62.2833L65.8743 23.9905Z"/><path d="M73.1143 22.7837C73.1143 20.6993 73.7128 19.0092 74.8813 17.6853C76.0498 16.3614 77.6743 15.7135 79.7548 15.7135C81.8353 15.7135 83.4598 16.3614 84.6569 17.6853C85.8254 19.0092 86.4239 20.6993 86.4239 22.7837V23.0654C86.4239 25.1499 85.8254 26.8681 84.6569 28.1638C83.4883 29.4596 81.8638 30.1356 79.7833 30.1356C77.     requestAnimationFrame(() => requestAnimationFrame(() => {
      setKnob("resKnob", r.p);
      document.querySelectorAll(".bar i[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
      const arc = document.querySelector(".confring .arc"); if (arc) arc.style.strokeDashoffset = arc.dataset.off;
    }));
    countUp($("#confNum"), r.confidence, "%");
    $("#restartBtn").addEventListener("click", renderIntro);
    const rc = $("#recheck"); if (rc) rc.addEventListener("click", startFlow);
    bindMemo();
  }, "is-result");

function countUp(el, to, suf=""){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = to + suf; return; }
  const t0 = performance.now(), d = 1400;
  const f = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e) + suf; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function bindMemo(){
  const FREE = ["gmail.com","yahoo.com","hotmail.com","outlook.com","icloud.com","aol.com","proton.me","protonmail.com","live.com","me.com"];
  $("#memoForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const em = $("#mEmail"), co = $("#mCo"), v = em.value.trim(), dom = (v.split("@")[1] || "").toLowerCase();
    const eMsg = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "Enter a valid email address." : FREE.includes(dom) ? "Please use your work email." : "";
    const cMsg = co.value.trim() ? "" : "Enter your company name.";
    const setErr = (inp, box, msg) => { inp.classList.remove("err"); void inp.offsetWidth; inp.classList.toggle("err", !!msg); box.textContent = msg; box.hidden = !msg; };
    setErr(em, $("#mEmailErr"), eMsg); setErr(co, $("#mCoErr"), cMsg);
    if (eMsg || cMsg) return;
    $("#memoForm").hidden = true;
    const s = $("#memoSent"); s.hidden = false;
    s.innerHTML = `<div class="sent"><span class="ok">${ic("i-check","")}</span><div><b>Sent (prototype)</b><span>In the live tool, the memo for ${esc(co.value.trim())} would arrive at ${esc(v)} within a minute.</span></div></div>`;
  });
}

if (DEMOS[demo]){ S.st = DEMOS[demo].st; S.answers = {...DEMOS[demo].answers}; renderResult(evaluate(S.st, S.answers)); }
else renderIntro();
window.WG = {evaluate, QUESTIONS, DEMOS};
